<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>This seat is empty — Kurultai</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f6f4f0">
<link rel="icon" href="/mark.svg" type="image/svg+xml">
<style>
:root{
  color-scheme:light;
  --paper:#f6f4f0;
  --panel:#ffffff;
  --ink:#161411;
  --ink-dim:#3d3a35;
  --mute:#5c574e;
  --line:#e4dfd6;
  --gold:#8f6d1f;
  --gold-line:#d4c4a0;
  --ok:#0a6b4a;
  --hold:#9a5b00;
  --no:#b42318;
  --ember:#9a3d2c;
  --font-d:ui-sans-serif,"Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-m:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-d);
  font-size:1.0625rem;
  min-height:100svh;
  display:grid;
  place-content:center;
  text-align:center;
  line-height:1.6;
  padding:clamp(1.5rem,4vh,2.5rem) clamp(1.25rem,3vw,2.5rem);
}
.frame{
  width:100%;
  max-width:none;
  background:var(--panel);
  border:1px solid var(--line);
  padding:2rem 1.5rem;
}
.kicker{
  font-family:var(--font-m);
  font-size:12px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--gold);
  margin-bottom:1.25rem;
}
p{
  font-size:clamp(1.15rem,3vw,1.35rem);
  font-weight:500;
  letter-spacing:-0.02em;
  color:var(--ink);
}
a{
  color:var(--gold);
  text-decoration:none;
  font-family:var(--font-m);
  font-size:12px;
  letter-spacing:.12em;
  text-transform:uppercase;
  margin-top:1.75rem;
  display:inline-block;
  padding-top:1rem;
  border-top:1px solid var(--gold-line);
}
a:hover{text-decoration:underline;text-underline-offset:.25em}
a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
</style>
</head>
<body>
<div class="frame">
  <p class="kicker">Kurultai · roster</p>
  <p>This seat is empty</p>
  <p><a href="/">Return to the ring</a></p>
</div>
</body>
</html>
