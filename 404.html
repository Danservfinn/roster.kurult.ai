<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>This seat is empty — Kurultai</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#05070A">
<link rel="icon" href="/mark.svg" type="image/svg+xml">
<style>
:root{
  color-scheme:dark;
  --void:#05070A;
  --ink:#F4F1EA;
  --muted:#7A7468;
  --gold:#E8A317;
  --gold-line:rgba(196,163,90,0.35);
  --font-d:ui-sans-serif,"Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-m:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
body{
  background:var(--void);
  color:var(--ink);
  font-family:var(--font-d);
  min-height:100svh;
  display:grid;
  place-content:center;
  text-align:center;
  line-height:1.65;
  padding:2rem;
  position:relative;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.03;
  background-image:
    radial-gradient(1px 1px at 20% 30%, rgba(244,241,234,.8), transparent),
    radial-gradient(1px 1px at 70% 60%, rgba(244,241,234,.6), transparent),
    radial-gradient(1px 1px at 40% 80%, rgba(244,241,234,.5), transparent);
}
@media print{body::before{display:none}}
.frame{position:relative;z-index:1;max-width:22rem}
.kicker{
  font-family:var(--font-m);
  font-size:10px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--gold);
  margin-bottom:1.25rem;
}
p{
  font-size:clamp(1.15rem,3vw,1.35rem);
  font-weight:500;
  letter-spacing:-0.02em;
  color:var(--ink);
}
a{
  color:var(--gold);
  text-decoration:none;
  font-family:var(--font-m);
  font-size:10px;
  letter-spacing:.16em;
  text-transform:uppercase;
  margin-top:1.75rem;
  display:inline-block;
  padding-top:1rem;
  border-top:1px solid var(--gold-line);
}
a:hover{text-decoration:underline;text-underline-offset:.25em}
a:focus-visible{outline:1px solid var(--gold);outline-offset:3px}
</style>
</head>
<body>
<div class="frame">
  <p class="kicker">Kurultai · roster</p>
  <p>This seat is empty</p>
  <p><a href="/">Return to the ring</a></p>
</div>
</body>
</html>
